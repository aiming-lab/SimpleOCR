# Example configuration file for SimpleOCR training
# Copy this file to config.yaml and modify paths according to your setup

data:
  # Training and validation data paths (modify these to your dataset locations)
  train_files: ./data/train.json
  val_files: ./data/validation.json
  
  # Data field keys
  prompt_key: question
  answer_key: answer
  image_key: image_path
  video_key: videos
  
  # Image directory (root directory containing images)
  image_dir: ./data/images
  
  video_fps: 2.0
  max_prompt_length: 3072
  max_response_length: 2048
  rollout_batch_size: 128
  mini_rollout_batch_size: null
  val_batch_size: 1024
  
  # Prompt template path
  format_prompt: ./examples/format_prompt/math.jinja
  override_chat_template: null
  
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 2097152
  filter_overlong_prompts: true
  
  # SimpleOCR specific settings
  enable_dual_branch: true  # Enable dual-branch training for SimpleOCR
  branch: B                 # Branch B uses text-overlaid images

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 4
    
    # Visual uncertainty coefficients (SimpleOCR specific)
    visual_uncertainty_coef_alpha: 1.0  # Set > 0 to enable uncertainty-aware training
    visual_uncertainty_coef_beta: 2.0
    token_entropy_coef_alpha: 0.01
    token_entropy_coef_beta: 2.0
    
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: false
    ulysses_size: 1
    
    model:
      model_path: Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 6
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score
    reward_function_kwargs: {format_weight: 0.33}

trainer:
  total_epochs: 2
  max_steps: 200
  project_name: simpleocr
  experiment_name: qwen2_5_7b_simpleocr
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 5
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 2
  save_limit: 2
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: true
